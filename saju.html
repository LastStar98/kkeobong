<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>사주 만세력</title><link rel="preconnect" href="https://cdn.jsdelivr.net"/><style>:root{--bg:#fbf7ef;--card:#fffdf8;--ink:#2c2418;--muted:#7a6e5d;--line:#e8dfd0;--wood:#2d6a4f;--fire:#c1121f;--earth:#b08968;--metal:#6c757d;--water:#1d3557;--radius:18px;--shadow:0 12px 40px rgba(44,36,24,.08)}*{box-sizing:border-box;margin:0;padding:0}body{font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.55}.topnav{display:flex;align-items:center;justify-content:space-between;max-width:960px;margin:0 auto;padding:14px 18px}.topnav-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:700}.topnav-brand .logo{width:34px;height:34px;border-radius:50%;background:#6f3658;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}.wrap{max-width:720px;margin:0 auto;padding:12px 16px 60px}header{text-align:center;margin-bottom:20px}header .badge{display:inline-block;font-size:12px;color:#6f3658;border:1px solid rgba(111,54,88,.35);padding:4px 12px;border-radius:999px;margin-bottom:10px;background:#f6eaf0}header h1{font-size:1.5rem;font-weight:700}header p{margin-top:8px;color:var(--muted);font-size:.9rem}.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);padding:20px 16px;margin-bottom:16px}.card h2{font-size:1.05rem;margin-bottom:14px;display:flex;align-items:center;gap:8px}.card h2::before{content:"";width:4px;height:1.1em;background:#6f3658;border-radius:2px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:520px){.form-grid{grid-template-columns:1fr}}label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:5px}input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:.95rem}button{flex:1;min-width:120px;padding:13px 18px;border:none;border-radius:12px;font-size:.98rem;font-weight:600;cursor:pointer}.btn-row{display:flex;gap:10px;margin-top:16px}.btn-primary{background:linear-gradient(135deg,#6f3658,#5a2b47);color:#fff}.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}@media(max-width:480px){.pillars{grid-template-columns:repeat(2,1fr)}}.pillar{text-align:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 6px;position:relative;overflow:hidden}.pillar::before{content:"";position:absolute;top:0;left:0;right:0;height:4px}.pillar[data-el="목"]::before{background:var(--wood)}.pillar[data-el="화"]::before{background:var(--fire)}.pillar[data-el="토"]::before{background:var(--earth)}.pillar[data-el="금"]::before{background:var(--metal)}.pillar[data-el="수"]::before{background:var(--water)}.pillar .label{font-size:.68rem;color:var(--muted);margin-bottom:6px}.pillar .hanja{font-size:1.85rem;font-weight:700;font-family:"Noto Serif KR",serif}.pillar .reading{font-size:.72rem;color:var(--muted)}.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.chip{font-size:.78rem;padding:5px 11px;border-radius:999px;background:#f3ebe0}.hidden{display:none!important}.bridge{background:linear-gradient(135deg,#6f3658,#5a2b47);border-radius:18px;padding:22px 20px;margin:12px 0 24px;color:#fff}.bridge button{width:100%;padding:18px;border:none;border-radius:14px;font-size:1.1rem;font-weight:700;background:#fff;color:#6f3658;cursor:pointer;margin-top:12px}.panel{background:#fffdf8;border-radius:16px;overflow:hidden;border:1px solid #e8dfd0;margin-bottom:14px}.panel img{width:100%;display:block;aspect-ratio:1;object-fit:cover}.panel .bubble{padding:14px 16px;font-size:.95rem;line-height:1.65}.panel .who{font-size:.75rem;color:#6f3658;font-weight:700;margin-bottom:6px}.cuttoon-chapter{margin-bottom:28px}.cuttoon-chapter h3{font-size:1rem;color:#6f3658;margin-bottom:12px}</style></head><body><nav class="topnav"><a class="topnav-brand" href="./"><span class="logo">꺼</span><span>꺼봉이가 봐주는 사주</span></a></nav><div class="wrap"><header><div class="badge">전체 사주</div><h1>꺼봉이가 봐주는 사주</h1><p>① 입력 → ② 만세력 → ③ 짧은 설명 → ④ 컷툰 (같은 사주)</p></header><section class="card" id="inputCard"><h2>① 정보 입력</h2><div class="form-grid"><div><label>양력/음력</label><select id="calendar"><option value="solar">양력</option><option value="lunar">음력</option></select></div><div><label>성별</label><select id="gender"><option value="남">남성</option><option value="여">여성</option></select></div><div><label>연도</label><input type="number" id="year" value="1990"/></div><div><label>월</label><input type="number" id="month" value="12"/></div><div><label>일</label><input type="number" id="day" value="20"/></div><div><label>시</label><input type="number" id="hour" value="16"/></div><div><label>분</label><input type="number" id="minute" value="30"/></div><div><label>윤달</label><select id="leap"><option value="false">아니오</option><option value="true">윤달</option></select></div><div style="grid-column:1/-1"><label>출생 지역</label><select id="place"><option value="126.9784">서울</option><option value="129.0756">부산</option><option value="128.6014">대구</option><option value="126.7052">인천</option><option value="126.8526">광주</option><option value="127.3845">대전</option><option value="129.3114">울산</option><option value="127.2892">수원</option><option value="126.3922">제주</option></select></div></div><div class="btn-row" style="margin-top:16px"><button class="btn-primary" id="btnCalc" type="button">만세력 보기</button><button class="btn-ghost" id="btnSample" type="button">예시</button></div></section><div id="loading" class="hidden" style="text-align:center;padding:20px">계산 중…</div><section id="result" class="hidden"><div class="card"><h2>② 만세력</h2><div class="meta" id="meta"></div><div class="pillars" id="pillars"></div></div><div class="card"><h2>③ 짧은 설명</h2><div id="story"></div></div><div class="bridge" id="bridge"><p><strong>④ 컷툰으로 이어가기</strong><br/>위에서 계산한 사주로 캐릭터 컷툰이 이어집니다. 다시 입력하지 않아요.</p><button type="button" id="btnCuttoon">컷툰으로 넘어가기 →</button></div><section id="cuttoon" class="hidden"></section></section><footer style="text-align:center;margin-top:24px;font-size:.75rem;color:#7a6e5d"><a href="./" style="color:#6f3658">← 홈</a></footer></div><script type="module">
import { calculateSaju } from "https://cdn.jsdelivr.net/npm/ssaju@0.2.0/dist/index.mjs";
const STEM={"甲":{ko:"갑",el:"목",short:"큰 나무"},"乙":{ko:"을",el:"목",short:"풀·꽃"},"丙":{ko:"병",el:"화",short:"태양"},"丁":{ko:"정",el:"화",short:"촛불"},"戊":{ko:"무",el:"토",short:"산"},"己":{ko:"기",el:"토",short:"밭"},"庚":{ko:"경",el:"금",short:"쇠"},"辛":{ko:"신",el:"금",short:"보석"},"壬":{ko:"임",el:"수",short:"바다"},"癸":{ko:"계",el:"수",short:"이슬"}};
const BRANCH={"子":{ko:"자",el:"수"},"丑":{ko:"축",el:"토"},"寅":{ko:"인",el:"목"},"卯":{ko:"묘",el:"목"},"辰":{ko:"진",el:"토"},"巳":{ko:"사",el:"화"},"午":{ko:"오",el:"화"},"未":{ko:"미",el:"토"},"申":{ko:"신",el:"금"},"酉":{ko:"유",el:"금"},"戌":{ko:"술",el:"토"},"亥":{ko:"해",el:"수"}};
const DAY={"甲":"너는 큰 나무처럼 곧고 앞장서는 사람이야.","乙":"너는 풀처럼 유연하고 잘 적응하는 사람이야.","丙":"너는 태양처럼 밝고 따뜻한 사람이야.","丁":"너는 촛불처럼 섬세하고 집중력 있는 사람이야.","戊":"너는 산처럼 믿음직한 사람이야.","己":"너는 밭처럼 현실적이고 다정한 사람이야.","庚":"너는 쇠처럼 결단력 있는 사람이야.","辛":"너는 보석처럼 섬세한 사람이야.","壬":"너는 바다처럼 넓은 사람이야.","癸":"너는 이슬처럼 직관적인 사람이야."};
const EL={목:"성장",화:"표현",토:"안정",금:"결단",수:"흐름"};const WHO={kkeobong:"꺼봉이",haesol:"해솔이",mito:"미토",jwau:"좌우"};
const $=id=>document.getElementById(id);let last=null;
function pillars(r){const o=["hour","day","month","year"],L={hour:"시주",day:"일주",month:"월주",year:"연주"};$("pillars").innerHTML="";o.forEach(k=>{const d=r.pillarDetails[k],st=STEM[d.stem]||{},br=BRANCH[d.branch]||{},el=d.element.stem;const div=document.createElement("div");div.className="pillar";div.dataset.el=el;div.innerHTML=`<div class="label">${L[k]}</div><div class="hanja">${d.stem}</div><div class="reading"><strong>${st.ko||""}</strong>·${st.el||""}</div><div class="hanja">${d.branch}</div><div class="reading"><strong>${br.ko||""}</strong>·${br.el||""}</div>`;$("pillars").appendChild(div)})}
function story(r){const ds=r.dayStem||r.pillarDetails.day.stem,info=STEM[ds]||{},fe=r.fiveElements||{},sorted=Object.entries(fe).sort((a,b)=>b[1]-a[1]),top=sorted[0];return `<p><strong>${info.ko||""}${ds} · ${info.short||""}</strong></p><p>${DAY[ds]||""}</p><p>${top?`오행 중 ${top[0]}(${EL[top[0]]}) 기운이 두드러져.`:`오행이 고른 편이야.`}</p><p>아래 컷툰에서 성격·일·돈·연애를 이어서 볼게.</p>`}
function cuttoon(r){const ds=r.dayStem||r.pillarDetails.day.stem,info=STEM[ds]||{},base=DAY[ds]||"",fe=r.fiveElements||{},sorted=Object.entries(fe).sort((a,b)=>b[1]-a[1]),top=sorted[0]?.[0]||"토",h=r.pillarDetails.hour,m=r.pillarDetails.month,y=r.pillarDetails.year,img=(c,s)=>`characters/scenes-v4/full/${c}/${s}.webp`;
const chs=[
{t:"너는 이런 사람이야",w:"kkeobong",p:[["self-01",`일간 ${info.ko||""}${ds}. ${base}`],["self-05",`시주 ${h.stem}${h.branch}, 월주 ${m.stem}${m.branch}`],["self-09",`연주 ${y.stem}${y.branch}이 네 뿌리야.`]]},
{t:"잘 풀릴 때",w:"haesol",p:[["strengths-01",`오행 중 ${top} 기운이 세. ${EL[top]} 쪽.`],["strengths-05",`${info.short||"네 기운"}을 살리면 흐름이 부드러워.`],["strengths-09",`약한 오행도 의식해 줘.`]]},
{t:"일",w:"mito",p:[["work-01",`월주 ${m.stem}${m.branch}이 일과 맞닿아 있어.`],["work-05",`${info.short||"성향"} 살리는 일이 맞아.`],["work-09",`틀에 억지로 넣지 마.`]]},
{t:"돈",w:"mito",p:[["money-01",`${top} 기운과 재물 흐름이 연결될 수 있어.`],["money-05",`네 속도에 맞게 쌓아.`],["money-09",`경향을 알면 조절이 쉬워.`]]},
{t:"연애",w:"jwau",p:[["love-01",`연애에서도 ${info.ko||""}${ds} 결이 나와. ${base}`],["love-05",`시주·월주가 표현 방식에 영향.`],["love-09",`네 기운 존중하는 관계를.`]]},
{t:"회복",w:"jwau",p:[["recovery-01",`지치면 쉬는 쪽을 허용해.`],["recovery-05",`몸·마음 신호를 무시하지 마.`],["recovery-09",`작은 루틴이 회복이야.`]]},
{t:"앞으로",w:"haesol",p:[["flow-01",`${top} 기운을 잘 쓰는 방향.`],["flow-05",`일간 ${info.ko||""}${ds} 중심의 짧은 목표.`],["flow-09",`오늘 한 걸음과 큰 그림을 같이.`]]},
{t:"오늘 하나",w:"kkeobong",p:[["closing-01",`${info.ko||""}${ds} 중심. 오늘 기운을 의식해 봐.`],["closing-05",`만세력 기둥을 기억해.`],["closing-09",`참고용이야. 선택은 네가 해. 응원할게.`]]}
];
return chs.map(c=>`<div class="cuttoon-chapter"><h3>${c.t}</h3>`+c.p.map(([s,tx])=>`<div class="panel"><img src="${img(c.w==="kkeobong"||c.w==="haesol"||c.w==="mito"||c.w==="jwau"?c.w:"kkeobong",s)}" loading="lazy"/><div class="bubble"><div class="who">${WHO[c.w]}</div>${tx}</div></div>`).join("")+`</div>`).join("")}
async function calc(){const year=+$("year").value,month=+$("month").value,day=+$("day").value,hour=+$("hour").value,minute=+$("minute").value,gender=$("gender").value,calendar=$("calendar").value,leap=$("leap").value==="true",longitude=+$("place").value;if(!year||!month||!day){alert("날짜 확인");return}$("loading").classList.remove("hidden");$("result").classList.add("hidden");try{const r=calculateSaju({year,month,day,hour,minute,gender,calendar,leap,timezone:"Asia/Seoul",longitude,applyLocalMeanTime:true});last=r;const ds=r.dayStem||r.pillarDetails.day.stem,info=STEM[ds];$("meta").innerHTML=`<span class="chip">일간 <strong>${info?.ko||""}${ds}</strong></span>`;pillars(r);$("story").innerHTML=story(r);$("cuttoon").classList.add("hidden");$("result").classList.remove("hidden");$("bridge").scrollIntoView({behavior:"smooth",block:"center"})}catch(e){alert(e.message||"오류")}finally{$("loading").classList.add("hidden")}}
$("btnCalc").onclick=calc;$("btnSample").onclick=()=>{$("year").value=1990;$("month").value=12;$("day").value=20;$("hour").value=16;calc()};$("btnCuttoon").onclick=()=>{if(!last){alert("먼저 만세력");return}$("cuttoon").innerHTML=cuttoon(last);$("cuttoon").classList.remove("hidden");$("cuttoon").scrollIntoView({behavior:"smooth"})};
</script></body></html>
