<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>사주 만세력 · 꺼봉이가 봐주는 만세력</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <style>
    :root {
      --bg: #fbf7ef;
      --card: #fffdf8;
      --ink: #2c2418;
      --muted: #7a6e5d;
      --accent: #c45c26;
      --line: #e8dfd0;
      --wood: #2d6a4f;
      --fire: #c1121f;
      --earth: #b08968;
      --metal: #6c757d;
      --water: #1d3557;
      --radius: 18px;
      --shadow: 0 12px 40px rgba(44, 36, 24, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      line-height: 1.55;
      background-image:
        radial-gradient(ellipse at 20% 0%, rgba(196, 92, 38, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(45, 106, 79, 0.05) 0%, transparent 45%);
    }

    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 18px 60px;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    header .badge {
      display: inline-block;
      font-size: 12px;
      letter-spacing: 0.12em;
      color: var(--accent);
      border: 1px solid rgba(196, 92, 38, 0.35);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    header h1 {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header p {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--line);
      padding: 22px 20px;
      margin-bottom: 18px;
    }

    .card h2 {
      font-size: 1.05rem;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card h2::before {
      content: "";
      width: 4px;
      height: 1.1em;
      background: var(--accent);
      border-radius: 2px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 520px) {
      .form-grid { grid-template-columns: 1fr; }
    }

    label {
      display: block;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 5px;
      letter-spacing: 0.02em;
    }

    input, select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      font-size: 0.95rem;
      color: var(--ink);
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    .row-full { grid-column: 1 / -1; }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    button {
      flex: 1;
      min-width: 120px;
      padding: 13px 18px;
      border: none;
      border-radius: 12px;
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s, opacity 0.12s;
    }

    button:active { transform: scale(0.98); }

    .btn-primary {
      background: linear-gradient(135deg, #c45c26, #a8461a);
      color: #fff;
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
    }

    /* 만세력 테이블 */
    .pillars-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 4px -4px 0;
      padding: 0 4px;
    }

    .pillars {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 10px;
      min-width: 520px;
    }

    .pillar {
      text-align: center;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 8px 16px;
      position: relative;
      overflow: hidden;
    }

    .pillar::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
    }

    .pillar[data-el="목"]::before { background: var(--wood); }
    .pillar[data-el="화"]::before { background: var(--fire); }
    .pillar[data-el="토"]::before { background: var(--earth); }
    .pillar[data-el="금"]::before { background: var(--metal); }
    .pillar[data-el="수"]::before { background: var(--water); }

    .pillar .label {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }

    .pillar .hanja {
      font-size: 2.15rem;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: 0.04em;
      font-family: "Noto Serif KR", "Batang", serif;
    }

    .pillar .hanja.stem { margin-bottom: 2px; }
    .pillar .hanja.branch { opacity: 0.92; }

    .pillar .ko {
      margin-top: 8px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .pillar .ko strong {
      color: var(--ink);
      font-weight: 600;
    }

    .pillar .tengod {
      margin-top: 10px;
      font-size: 0.75rem;
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      background: #f3ebe0;
      color: #5c4f3d;
    }

    .el-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-right: 4px;
      vertical-align: middle;
    }
    .el-dot.목 { background: var(--wood); }
    .el-dot.화 { background: var(--fire); }
    .el-dot.토 { background: var(--earth); }
    .el-dot.금 { background: var(--metal); }
    .el-dot.수 { background: var(--water); }

    /* 오행 바 */
    .ohang {
      display: grid;
      gap: 10px;
      margin-top: 6px;
    }

    .ohang-row {
      display: grid;
      grid-template-columns: 42px 1fr 28px;
      align-items: center;
      gap: 10px;
      font-size: 0.88rem;
    }

    .ohang-bar {
      height: 10px;
      background: #efe8dc;
      border-radius: 999px;
      overflow: hidden;
    }

    .ohang-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.45s ease;
    }

    .ohang-fill.목 { background: var(--wood); }
    .ohang-fill.화 { background: var(--fire); }
    .ohang-fill.토 { background: var(--earth); }
    .ohang-fill.금 { background: var(--metal); }
    .ohang-fill.수 { background: var(--water); }

    /* 해석 카드 */
    .story {
      font-size: 0.98rem;
      line-height: 1.7;
    }

    .story .lead {
      font-size: 1.08rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--accent);
    }

    .story p + p { margin-top: 10px; }

    .story .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #f3ebe0;
      padding: 2px 9px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin: 0 2px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .chip {
      font-size: 0.78rem;
      padding: 5px 11px;
      border-radius: 999px;
      background: #f3ebe0;
      color: #5c4f3d;
    }

    .chip strong { color: var(--ink); }

    .hint {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 14px;
      text-align: center;
    }

    .hidden { display: none !important; }

    .loading {
      text-align: center;
      padding: 30px;
      color: var(--muted);
    }

    footer {
      text-align: center;
      margin-top: 28px;
      font-size: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="badge">四柱 · 만세력</div>
      <h1>꺼봉이가 봐주는 만세력</h1>
      <p>생년월일 넣으면 예쁜 만세력이랑 “너는 이런 사람이야” 이야기를 해줄게</p>
    </header>

    <section class="card" id="inputCard">
      <h2>정보 입력</h2>
      <div class="form-grid">
        <div>
          <label>양력 / 음력</label>
          <select id="calendar">
            <option value="solar">양력</option>
            <option value="lunar">음력</option>
          </select>
        </div>
        <div>
          <label>성별</label>
          <select id="gender">
            <option value="남">남성</option>
            <option value="여">여성</option>
          </select>
        </div>
        <div>
          <label>출생 연도</label>
          <input type="number" id="year" min="1900" max="2100" value="1990" />
        </div>
        <div>
          <label>월</label>
          <input type="number" id="month" min="1" max="12" value="12" />
        </div>
        <div>
          <label>일</label>
          <input type="number" id="day" min="1" max="31" value="20" />
        </div>
        <div>
          <label>시 (0~23)</label>
          <input type="number" id="hour" min="0" max="23" value="16" />
        </div>
        <div>
          <label>분</label>
          <input type="number" id="minute" min="0" max="59" value="30" />
        </div>
        <div>
          <label>윤달 (음력일 때)</label>
          <select id="leap">
            <option value="false">아니오</option>
            <option value="true">윤달</option>
          </select>
        </div>
      </div>
      <div class="btn-row">
        <button type="button" class="btn-primary" id="btnCalc">만세력 보기</button>
        <button type="button" class="btn-ghost" id="btnSample">예시로 채우기</button>
      </div>
    </section>

    <div id="loading" class="card loading hidden">계산 중…</div>

    <section id="result" class="hidden">
      <div class="card">
        <h2>사주 만세력</h2>
        <div class="meta" id="meta"></div>
        <div class="pillars-wrap">
          <div class="pillars" id="pillars"></div>
        </div>
        <p class="hint">왼쪽부터 시주 · 일주 · 월주 · 연주 · 한자 아래 짧은 한글 설명</p>
      </div>

      <div class="card">
        <h2>오행 분포</h2>
        <div class="ohang" id="ohang"></div>
      </div>

      <div class="card">
        <h2>너의 사주에 이런 게 있어서, 너는 이런 사람이야</h2>
        <div class="story" id="story"></div>
      </div>
    </section>

    <footer>
      계산 엔진: ssaju · 참고용이며 전문 상담을 대체하지 않습니다 · <a href="./" style="color:var(--accent)">홈으로</a>
    </footer>
  </div>

  <script type="module">
    import { calculateSaju } from "https://cdn.jsdelivr.net/npm/ssaju@0.2.0/dist/index.mjs";

    // 천간·지지 짧은 한글 설명
    const STEM_DESC = {
      "甲": { ko: "갑", short: "큰 나무 · 리더십", tip: "곧고 씩씩한 기운" },
      "乙": { ko: "을", short: "풀·꽃 · 유연함", tip: "부드럽고 적응하는 기운" },
      "丙": { ko: "병", short: "태양 · 밝음", tip: "열정과 표현력" },
      "丁": { ko: "정", short: "촛불 · 섬세함", tip: "따뜻하고 집중하는 기운" },
      "戊": { ko: "무", short: "산 · 믿음직함", tip: "안정과 포용" },
      "己": { ko: "기", short: "밭 · 중재", tip: "현실적이고 다정한 기운" },
      "庚": { ko: "경", short: "쇠 · 결단", tip: "날카롭고 추진력" },
      "辛": { ko: "신", short: "보석 · 세심함", tip: "섬세하고 예민한 기운" },
      "壬": { ko: "임", short: "바다 · 포용", tip: "넓고 지혜로운 기운" },
      "癸": { ko: "계", short: "이슬 · 직관", tip: "섬세하고 사색하는 기운" }
    };

    const BRANCH_DESC = {
      "子": { ko: "자", short: "쥐 · 지혜", animal: "쥐" },
      "丑": { ko: "축", short: "소 · 성실", animal: "소" },
      "寅": { ko: "인", short: "호랑이 · 용기", animal: "호랑이" },
      "卯": { ko: "묘", short: "토끼 · 온화", animal: "토끼" },
      "辰": { ko: "진", short: "용 · 변화", animal: "용" },
      "巳": { ko: "사", short: "뱀 · 통찰", animal: "뱀" },
      "午": { ko: "오", short: "말 · 열정", animal: "말" },
      "未": { ko: "미", short: "양 · 온순", animal: "양" },
      "申": { ko: "신", short: "원숭이 · 재치", animal: "원숭이" },
      "酉": { ko: "유", short: "닭 · 꼼꼼", animal: "닭" },
      "戌": { ko: "술", short: "개 · 충성", animal: "개" },
      "亥": { ko: "해", short: "돼지 · 순수", animal: "돼지" }
    };

    const EL_OF_STEM = {
      "甲": "목", "乙": "목", "丙": "화", "丁": "화",
      "戊": "토", "己": "토", "庚": "금", "辛": "금",
      "壬": "수", "癸": "수"
    };

    const EL_OF_BRANCH = {
      "子": "수", "丑": "토", "寅": "목", "卯": "목",
      "辰": "토", "巳": "화", "午": "화", "未": "토",
      "申": "금", "酉": "금", "戌": "토", "亥": "수"
    };

    const DAY_MASTER_STORY = {
      "甲": "너는 큰 나무 같은 사람이야. 곧게 뻗어 올라가려는 기운이 강해서, 목표가 생기면 앞을 보고 밀어붙이는 힘이 있어. 주변에 든든한 버팀목이 되어 주는 타입이지.",
      "乙": "너는 풀이나 꽃처럼 유연한 사람이야. 강한 바람에도 부러지지 않고 휘어지는 능력이 있어. 사람들과 잘 어울리고, 상황에 맞춰 자연스럽게 적응하는 매력이 돋보여.",
      "丙": "너는 태양처럼 밝은 사람이야. 어디에 있어도 분위기를 환하게 만들고, 열정적으로 표현하는 힘이 있어. 사람들이 너를 보면 에너지가 느껴지지.",
      "丁": "너는 촛불처럼 따뜻하고 집중력 있는 사람이야. 작은 불씨라도 한 곳에 오래 머무르며 깊이 파고드는 힘이 있어. 섬세하고 진심 어린 면이 매력적이야.",
      "戊": "너는 산처럼 믿음직한 사람이야. 쉽게 흔들리지 않고, 주변을 든든하게 감싸 주는 기운이 있어. 사람들이 너에게 기대고 싶어 하는 안정감이 있지.",
      "己": "너는 밭처럼 현실적이고 다정한 사람이야. 땅을 일구듯 차근차근 쌓아 올리는 힘이 있고, 사람들 사이에서 중재하고 돌보는 역할도 잘 해.",
      "庚": "너는 쇠처럼 결단력 있는 사람이야. 날카롭고 추진력이 있어서, 한 번 방향을 정하면 강하게 밀어붙이는 힘이 있어. 원칙을 중시하는 면도 돋보여.",
      "辛": "너는 보석처럼 섬세하고 예민한 사람이야. 작은 것도 잘 느끼고, 아름다움과 완성도를 중요하게 생각해. 세심한 배려가 너의 큰 장점이야.",
      "壬": "너는 바다처럼 넓은 사람이야. 포용력이 크고, 지혜롭게 흐름을 읽는 능력이 있어. 깊은 생각과 유연한 사고로 여러 가능성을 열어 두는 타입이지.",
      "癸": "너는 이슬처럼 섬세하고 직관적인 사람이야. 조용히 스며들며 본질을 보는 힘이 있고, 사색과 감수성이 풍부해. 남들이 놓치는 부분을 잘 포착하지."
    };

    const $ = (id) => document.getElementById(id);

    function renderPillars(r) {
      const order = ["hour", "day", "month", "year"];
      const labels = { hour: "시주", day: "일주", month: "월주", year: "연주" };
      const html = order.map((key) => {
        const p = r.pillarDetails[key];
        const stem = p.stem;
        const branch = p.branch;
        const el = EL_OF_STEM[stem] || "토";
        const sd = STEM_DESC[stem] || {};
        const bd = BRANCH_DESC[branch] || {};
        const tengod = p.tenGod || "";
        return `
          <div class="pillar" data-el="${el}">
            <div class="label">${labels[key]}</div>
            <div class="hanja stem">${stem}</div>
            <div class="hanja branch">${branch}</div>
            <div class="ko"><strong>${sd.ko || ""}${stem}</strong> · ${sd.short || ""}</div>
            <div class="ko"><strong>${bd.ko || ""}${branch}</strong> · ${bd.short || ""}</div>
            ${tengod ? `<div class="tengod">${tengod}</div>` : ""}
          </div>`;
      }).join("");
      $("pillars").innerHTML = html;
    }

    function renderOhang(r) {
      const counts = { "목": 0, "화": 0, "토": 0, "금": 0, "수": 0 };
      ["hour", "day", "month", "year"].forEach((k) => {
        const p = r.pillarDetails[k];
        counts[EL_OF_STEM[p.stem]] = (counts[EL_OF_STEM[p.stem]] || 0) + 1;
        counts[EL_OF_BRANCH[p.branch]] = (counts[EL_OF_BRANCH[p.branch]] || 0) + 1;
      });
      const max = Math.max(...Object.values(counts), 1);
      const order = ["목", "화", "토", "금", "수"];
      $("ohang").innerHTML = order.map((el) => {
        const n = counts[el] || 0;
        const pct = Math.round((n / max) * 100);
        return `
          <div class="ohang-row">
            <span><span class="el-dot ${el}"></span>${el}</span>
            <div class="ohang-bar"><div class="ohang-fill ${el}" style="width:${pct}%"></div></div>
            <span>${n}</span>
          </div>`;
      }).join("");
    }

    function buildStory(r) {
      const dayStem = r.dayStem || r.pillarDetails.day.stem;
      const base = DAY_MASTER_STORY[dayStem] || "너의 일간이 특별한 기운을 가지고 있어.";
      const interp = r.advanced?.interpretation || {};
      const strength = interp.strength || "";
      const hyungsin = (r.advanced?.hyungsin || []).slice(0, 3).join(", ");

      return `
        <p class="lead">${base}</p>
        <p>일간 <span class="tag">${STEM_DESC[dayStem]?.ko || ""}${dayStem}</span>이 네 사주의 중심이야. 그래서 너는 기본적으로 이런 성향을 띠게 돼.</p>
        ${strength ? `<p>전체적으로 보면 <span class="tag">${strength}</span> 쪽의 기운이 느껴져. 이걸 잘 활용하면 더 편안하게 네 길을 갈 수 있을 거야.</p>` : ""}
        ${hyungsin ? `<p>주의할 신살: <span class="tag">${hyungsin}</span> — 너무 걱정할 필요는 없고, ‘이런 경향이 있을 수 있다’ 정도로만 기억해 둬.</p>` : ""}
        <p style="margin-top:14px;color:var(--muted);font-size:0.9rem;">이 설명은 사주의 기본 구조를 바탕으로 한 참고용이야. 실제 인생은 훨씬 더 많은 변수로 만들어져.</p>
      `;
    }

    function renderMeta(r) {
      const d = r.pillarDetails.day;
      const dayStem = r.dayStem || d.stem;
      const info = STEM_DESC[dayStem];
      $("meta").innerHTML = `
        <span class="chip">일간 <strong>${info?.ko || ""}${dayStem}</strong></span>
        <span class="chip">${r.input.gender === "남" ? "남성" : "여성"}</span>
        <span class="chip">${r.input.calendar === "solar" ? "양력" : "음력"} ${r.input.year}.${r.input.month}.${r.input.day} ${String(r.input.hour).padStart(2,"0")}:${String(r.input.minute).padStart(2,"0")}</span>
        ${r.advanced?.geukguk ? `<span class="chip">격국 <strong>${r.advanced.geukguk}</strong></span>` : ""}
      `;
    }

    async function calc() {
      const year = +$("year").value;
      const month = +$("month").value;
      const day = +$("day").value;
      const hour = +$("hour").value;
      const minute = +$("minute").value;
      const gender = $("gender").value;
      const calendar = $("calendar").value;
      const leap = $("leap").value === "true";

      if (!year || !month || !day) {
        alert("연·월·일을 확인해 주세요.");
        return;
      }

      $("loading").classList.remove("hidden");
      $("result").classList.add("hidden");

      try {
        const r = calculateSaju({
          year, month, day, hour, minute,
          gender,
          calendar,
          leap,
          timezone: "Asia/Seoul"
        });

        renderMeta(r);
        renderPillars(r);
        renderOhang(r);
        $("story").innerHTML = buildStory(r);

        $("result").classList.remove("hidden");
        $("result").scrollIntoView({ behavior: "smooth", block: "start" });
      } catch (e) {
        console.error(e);
        alert("계산 중 오류가 났어요. 날짜·시간을 다시 확인해 주세요.\n" + (e.message || ""));
      } finally {
        $("loading").classList.add("hidden");
      }
    }

    $("btnCalc").addEventListener("click", calc);
    $("btnSample").addEventListener("click", () => {
      $("year").value = 1990;
      $("month").value = 12;
      $("day").value = 20;
      $("hour").value = 16;
      $("minute").value = 30;
      $("gender").value = "남";
      $("calendar").value = "solar";
      $("leap").value = "false";
      calc();
    });
  </script>
</body>
</html>
